<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CubeProgress</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/3dandcanvas-design-system-39c2f27a-19b5-4e24-81e1-72229778b310/tokens/fonts.css">
<link rel="stylesheet" href="_ds/3dandcanvas-design-system-39c2f27a-19b5-4e24-81e1-72229778b310/tokens/colors.css">

<link rel="stylesheet" href="_ds/3dandcanvas-design-system-39c2f27a-19b5-4e24-81e1-72229778b310/tokens/spacing.css">
<link rel="stylesheet" href="_ds/3dandcanvas-design-system-39c2f27a-19b5-4e24-81e1-72229778b310/tokens/radius.css">

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<link rel="stylesheet" href="cube-tokens.css">
<style>
/* "Your cube": the user's cube in 3D, filling in as each side is entered, the side being
   entered now, and six progress pips. Shared by camera capture and manual entry, which
   both hand it the faces entered so far and which side is current.
   Variants: mirrored (camera preview flipped); stripInteractive (pips reopen a side);
   done (the cube spins, can be dragged, and the next actions appear). A done cube is never
   mirrored: it turns round to the way the cube really is, so it can be checked against it.
   notice is the verdict on the cube (stickers fit, or don't): it always sits here, under the
   pips, however the cube was entered. checkDisabled holds the main action back until the cube
   is possible; onFix adds a way to go and correct it. */
[data-sc-name="CubeProgress"]{display:flex;min-width:0;min-height:0}
.cp{position:relative;flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0;padding:var(--panel-pad);border-radius:var(--radius-3xl);background:var(--surface-float);box-shadow:var(--shadow-panel);font-family:var(--font-sans);letter-spacing:var(--tracking-snug);color:var(--text-primary)}
.cp-head{display:flex;align-items:center;gap:var(--space-5);padding-left:var(--space-2)}
.cp-head h2{margin:0;font:var(--type-section-label)}
.cp-tag{font:var(--type-mono);font-size:var(--text-2xs);letter-spacing:var(--tracking-caps);color:var(--text-tertiary);opacity:0;transition:opacity var(--dur-base) var(--ease-out)}
.cp[data-mirrored="true"] .cp-tag{opacity:1}
.cp-well{position:relative;flex:1 1 auto;min-height:0;margin:var(--space-4) 0 var(--space-6)}
.cp-host{position:absolute;inset:0;transition:transform var(--dur-slow) var(--ease-out)}
.cp[data-mirrored="true"] .cp-host{transform:scaleX(-1)}
/* until the engine is up, a quiet placeholder holds the space */
.cp-wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--text-tertiary);font:var(--type-caption);pointer-events:none}
.cp-hint{position:absolute;left:50%;top:50%;padding:var(--space-1) var(--space-4);border-radius:var(--radius-xs);background:var(--surface-glass);-webkit-backdrop-filter:var(--blur-glass);backdrop-filter:var(--blur-glass);font:var(--type-mono);color:var(--text-secondary);white-space:nowrap;pointer-events:none;transform:translate(-50%,-50%);transition:opacity var(--dur-base) var(--ease-out);animation:cp-hint-in var(--dur-slower) var(--ease-out) 600ms backwards}
.cp-well.is-drag .cp-hint{opacity:0;transition-duration:var(--dur-fast)}
@keyframes cp-hint-in{from{opacity:0}}
.cp-now{display:flex;align-items:center;gap:var(--space-6);min-width:0;padding:0 var(--space-2)}
.cp-now-sw{width:36px;height:36px;flex:0 0 auto;border-radius:var(--radius-md);background:var(--c);box-shadow:var(--sticker-edge);transition:background-color var(--dur-slow) var(--ease-out)}
.cp-now-t{display:block;font:var(--type-heading);letter-spacing:var(--tracking-tight)}
.cp-now-s{display:block;margin-top:2px;font:var(--type-mono);color:var(--text-secondary)}
.cp-strip{display:flex;gap:var(--space-4);margin-top:var(--space-8);padding:var(--space-6) var(--space-2) 0;border-top:1px solid var(--border-subtle)}
.cp-pip{position:relative;display:grid;place-items:center;width:24px;height:24px;padding:0;border:0;border-radius:7px;background:var(--c);box-shadow:var(--sticker-edge);opacity:.32;transform:scale(.84);transition:opacity var(--dur-base) var(--ease-out),transform var(--dur-slow) var(--ease-spring-out),box-shadow var(--dur-fast) var(--ease-out)}
.cp-pip.is-light{box-shadow:var(--sticker-edge-light)}
.cp-pip.is-done{opacity:1;transform:none}
.cp-pip.is-now{opacity:1;transform:none;box-shadow:var(--sticker-edge),var(--ring-selected)}
.cp-pip.is-flag{opacity:1;transform:none;box-shadow:var(--sticker-edge),var(--ring-flagged);animation:cp-flag 1.4s var(--ease-in-out) infinite}
@keyframes cp-flag{50%{transform:translateY(-3px)}}
.cp-pip i{font-size:14px;color:var(--gray-0);opacity:0;transform:scale(.5);transition:opacity var(--dur-fast) var(--ease-out),transform var(--dur-slow) var(--ease-spring-out)}
.cp-pip.is-light i{color:var(--gray-900)}
.cp-pip.is-done i{opacity:1;transform:none}
button.cp-pip{cursor:default}
button.cp-pip:not(:disabled){cursor:pointer}
button.cp-pip:not(:disabled):hover{transform:translateY(-2px)}
button.cp-pip:focus-visible{outline:2px solid var(--border-focus);outline-offset:var(--ring-focus-offset)}
.cp-notice{display:flex;margin-top:var(--space-6);animation:dc-float-in var(--dur-base) var(--ease-out)}
.cp-notice [data-sc-name="StatusLine"]{display:flex;flex:1 1 auto;min-width:0}
.cp-notice .sl{flex:1 1 auto}
.cp-acts{display:flex;flex-direction:column;gap:var(--space-4);margin-top:var(--space-6);animation:dc-float-in var(--dur-base) var(--ease-out)}
.cp-acts .dc-btn{width:100%}
.cp-acts-2{display:flex;gap:var(--space-4)}
.cp-acts-2 .dc-btn{flex:1 1 0;width:auto}
@media (max-width:760px){
  .cp{padding:var(--space-6)}
  .cp-well{margin:var(--space-4) 0}
  /* phone: progress sits beside the side name and the two actions share a row, so the cube keeps the height */
  .cp-foot{display:flex;align-items:center;gap:var(--space-6)}
  .cp-now{gap:var(--space-5);padding:0}
  .cp-now-sw{width:32px;height:32px}
  .cp-now-t{font-size:var(--text-xl);white-space:nowrap}
  .cp-now-s{white-space:nowrap}
  .cp-strip{margin:0 0 0 auto;padding:0;border-top:0;gap:var(--space-2)}
  .cp-pip{width:22px;height:22px;border-radius:6px}
  .cp-acts{flex-flow:row-reverse wrap;align-items:center}
  .cp-acts-2{display:contents}
  .cp-acts .dc-btn{width:auto;flex:0 0 auto}
  .cp-acts .dc-btn--accent{flex:1 1 auto}
}
@media (prefers-reduced-motion:reduce){.cp-pip.is-flag,.cp-acts,.cp-notice,.cp-hint{animation:none}.cp-host{transition:none}}
</style>
</helmet>

<aside class="cp" data-mirrored="{{ mirrored }}" aria-label="Your cube">
  <div class="cp-head">
    <h2>Your cube</h2>
    <span class="cp-tag">MIRRORED</span>
  </div>
  <div class="cp-well" ref="{{ wellRef }}">
    <div class="cp-host" ref="{{ hostRef }}" role="img" aria-label="{{ label }}"></div>
    <sc-if value="{{ waiting }}" hint-placeholder-val="{{ false }}">
      <span class="cp-wait">Loading 3D cube…</span>
    </sc-if>
    <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
      <span class="cp-hint" aria-hidden="true">drag to inspect</span>
    </sc-if>
  </div>
  <div class="cp-foot">
    <div class="cp-now">
      <span class="cp-now-sw" style="--c:{{ nowColour }}"></span>
      <span><span class="cp-now-t">{{ nowTitle }}</span><span class="cp-now-s">{{ nowSub }}</span></span>
    </div>
    <sc-if value="{{ stripInteractive }}" hint-placeholder-val="{{ false }}">
      <div class="cp-strip" role="group" aria-label="Sides">
        <sc-for list="{{ strip }}" as="f" hint-placeholder-count="6">
          <button type="button" class="cp-pip {{ f.cls }}" style="--c:{{ f.colour }}" aria-label="{{ f.label }}" disabled="{{ f.off }}" onClick="{{ f.open }}"><i class="hgi-stroke hgi-tick-02" aria-hidden="true"></i></button>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ stripStatic }}" hint-placeholder-val="{{ true }}">
      <div class="cp-strip" aria-hidden="true">
        <sc-for list="{{ strip }}" as="f" hint-placeholder-count="6">
          <span class="cp-pip {{ f.cls }}" style="--c:{{ f.colour }}"><i class="hgi-stroke hgi-tick-02"></i></span>
        </sc-for>
      </div>
    </sc-if>
  </div>
  <sc-if value="{{ hasNotice }}" hint-placeholder-val="{{ false }}">
    <div class="cp-notice"><dc-import name="StatusLine" surface="sunken" lead="icon" text="{{ notice.text }}" icon="{{ notice.icon }}" tone="{{ notice.tone }}" hint-size="100%,40px"></dc-import></div>
  </sc-if>
  <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
    <div class="cp-acts">
      <x-import component-from-global-scope="Ds3DandCanvasDesignSystem_39c2f2.Button" variant="accent" size="lg" icon-end="arrow-right-02" magnetic="{{ yes }}" disabled="{{ checkOff }}" onClick="{{ onCheck }}" hint-size="100%,40px">{{ checkLabel }}</x-import>
      <div class="cp-acts-2">
        <sc-if value="{{ hasFix }}" hint-placeholder-val="{{ false }}">
          <x-import component-from-global-scope="Ds3DandCanvasDesignSystem_39c2f2.Button" variant="outline" icon="paint-board" onClick="{{ onFix }}" hint-size="120px,34px">{{ fixLabel }}</x-import>
        </sc-if>
        <x-import component-from-global-scope="Ds3DandCanvasDesignSystem_39c2f2.Button" variant="quiet" icon="reload" onClick="{{ onRestart }}" hint-size="120px,34px">{{ restartLabel }}</x-import>
      </div>
    </div>
  </sc-if>
</aside>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":420,"height":620},"faces":{"editor":null,"tsType":"{ U, R, F, D, L, B: (string | null)[] | null }"},"pose":{"editor":"int","min":0,"max":5,"default":0,"tsType":"number","section":"State"},"done":{"editor":"boolean","default":false,"tsType":"boolean","section":"State"},"mirrored":{"editor":"boolean","default":false,"tsType":"boolean","section":"Variant"},"stripInteractive":{"editor":"boolean","default":false,"tsType":"boolean","section":"Variant"},"nowColour":{"editor":null,"tsType":"string"},"nowTitle":{"editor":null,"tsType":"string"},"nowSub":{"editor":null,"tsType":"string"},"strip":{"editor":null,"tsType":"{ colour: string, done?: boolean, now?: boolean, flagged?: boolean, light?: boolean, label?: string, open?: () =&gt; void }[]"},"label":{"editor":null,"tsType":"string"},"restartLabel":{"editor":null,"tsType":"string"},"onRestart":{"editor":null,"tsType":"() =&gt; void"},"checkLabel":{"editor":null,"tsType":"string"},"checkDisabled":{"editor":"boolean","default":false,"tsType":"boolean","section":"State"},"notice":{"editor":null,"tsType":"{ tone: &#39;warn&#39; | &#39;ok&#39;, icon: string, text: string } | null"},"fixLabel":{"editor":null,"tsType":"string"},"onFix":{"editor":null,"tsType":"() =&gt; void"},"onCheck":{"editor":null,"tsType":"() =&gt; void"}}'>
const reducedMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const noop = () => {};
const SAMPLE_STRIP = ['var(--cube-green)', 'var(--cube-red)', 'var(--cube-blue)', 'var(--cube-orange)', 'var(--cube-white)', 'var(--cube-yellow)']
  .map((colour, i) => ({ colour, done: i < 2, now: i === 2, light: i > 3 }));

class Component extends DCLogic {
  state = { engineReady: false };

  async componentDidMount() {
    try {
      const url = p => new URL(p, document.baseURI).href;
      const [cc, eng] = await Promise.all([import(url('./cube-capture.mjs')), this.waitForThree().then(() => import(url('./cube-engine.js')))]);
      if (this.gone || !this.host) return;
      this.cc = cc;
      this.viewer = new eng.CubeEngine(this.host);
      // No hover ghosts: this cube is for looking at, not for picking pieces.
      this.viewer.model.userData.ghosts.forEach(g => { g.visible = false; });
      this.viewer.model.userData.ghosts.length = 0;
      // A little closer than the engine's default fit (closer still in a phone's short well);
      // the zoom flag keeps that ratio on resize.
      this.viewer._zoomed = true;
      this.viewer.want.r = this.viewer.home.r * (this.host.clientHeight < 320 ? 0.58 : 0.74);
      this.byId = new Map(this.viewer.model.userData.cubies.map(c => [c.userData.id, c]));
      this.shown = new Map();
      this.bindDrag();
      this.paint();
      this.aim();
      this.setState({ engineReady: true });
    } catch (e) { console.error('[cube-progress] 3D unavailable', e); }
  }
  componentWillUnmount() {
    this.gone = true;
    clearTimeout(this.qt); clearInterval(this.spin);
    if (this.viewer) this.viewer.dispose();
  }
  componentDidUpdate(prev) {
    const p = this.props;
    prev = prev || {};
    if (prev.faces !== p.faces) this.paint();
    if (prev.pose !== p.pose || prev.done !== p.done) this.aim();
  }
  waitForThree(ms = 15000) {
    return new Promise((res, rej) => {
      const t0 = Date.now();
      const poll = () => window.THREE ? res() : Date.now() - t0 > ms ? rej(new Error('three.js did not load')) : setTimeout(poll, 40);
      poll();
    });
  }

  // ---------------------------------------------------------------- painting
  setSticker(m, key) {
    m.userData.base.set(key ? this.cc.HEX[key] : this.cc.EMPTY_HEX);
    m.material.color.copy(m.userData.base);
    if (m.userData.ghost) m.userData.ghost.material.color.copy(m.userData.base);
    this.shown.set(m, key);
  }
  // Recolours and clears land at once. When several stickers fill in together (a side just
  // captured), they arrive one by one in reading order, so the eye follows the side landing.
  paint() {
    const v = this.viewer, cc = this.cc;
    if (!v || !cc) return;
    clearTimeout(this.qt);
    (this.queue || []).forEach(([m, key]) => this.setSticker(m, key));
    this.queue = [];
    const faces = this.props.faces || {}, fills = [];
    v.model.userData.stickers.forEach(m => {
      const f = m.userData.face, cells = faces[f];
      const at = cc.stickerIndex(f, this.byId.get(m.userData.cubie).position);
      const key = (cells && cells[at]) || null;
      if (this.shown.get(m) === key) return;
      if (key && !this.shown.get(m)) fills.push([m, key, at]);
      else this.setSticker(m, key);
    });
    if (fills.length <= 1 || reducedMotion()) return fills.forEach(([m, key]) => this.setSticker(m, key));
    this.queue = fills.sort((a, b) => a[2] - b[2]).map(([m, key]) => [m, key]);
    const step = () => {
      const next = this.queue.shift();
      if (!next) return;
      this.setSticker(next[0], next[1]);
      this.qt = setTimeout(step, 45);
    };
    step();
  }
  // Point the camera at the side being entered, or spin the finished cube until it's grabbed.
  aim() {
    const v = this.viewer, cc = this.cc;
    if (!v || !cc) return;
    clearInterval(this.spin);
    if (this.props.done) {
      if (!this.userDragged && !reducedMotion()) { v.want.phi = 1.03; this.spin = setInterval(() => { v.want.theta += 0.012; }, 16); }
      return;
    }
    this.userDragged = false;
    const [theta, phi] = cc.POSES[Math.max(0, Math.min(5, this.props.pose ?? 0))];
    // Keep turning the same way round rather than swinging back through the long side.
    let t = theta;
    while (t < v.want.theta - Math.PI) t += Math.PI * 2;
    while (t > v.want.theta + Math.PI) t -= Math.PI * 2;
    v.want.theta = t; v.want.phi = phi;
  }
  // The engine turns the cube toward the drag. The mirrored view is the same canvas flipped
  // with CSS, so there the turn reads backwards; these listeners run after the engine's and
  // redo the horizontal part the other way round.
  bindDrag() {
    const cv = this.viewer._cv;
    if (!cv) return;
    let d = null;
    cv.addEventListener('pointerdown', e => {
      d = { x: e.clientX, t: this.viewer.want.theta };
      this.userDragged = true; clearInterval(this.spin);
      if (this.well) this.well.classList.add('is-drag');
    });
    cv.addEventListener('pointermove', e => { if (d && this.flipped()) this.viewer.want.theta = d.t + (e.clientX - d.x) * 0.0085; });
    const end = () => { d = null; if (this.well) this.well.classList.remove('is-drag'); };
    cv.addEventListener('pointerup', end);
    cv.addEventListener('pointercancel', end);
  }

  flipped() { return !!this.props.mirrored && !this.props.done; }

  renderVals() {
    const p = this.props, interactive = !!p.stripInteractive;
    return {
      yes: true,
      mirrored: String(this.flipped()), done: !!p.done, waiting: !this.state.engineReady,
      label: p.label ?? '3D cube, filling in as each side is entered',
      nowColour: p.nowColour ?? 'var(--cube-green)', nowTitle: p.nowTitle ?? 'Front', nowSub: p.nowSub ?? 'Green centre · 1/6',
      stripInteractive: interactive, stripStatic: !interactive,
      strip: (p.strip || SAMPLE_STRIP).map(f => ({
        colour: f.colour, label: f.label || '', open: f.open || noop, off: !f.open,
        cls: [f.done ? 'is-done' : '', f.now ? 'is-now' : '', f.flagged ? 'is-flag' : '', f.light ? 'is-light' : ''].join(' ')
      })),
      restartLabel: p.restartLabel ?? 'Start over', onRestart: p.onRestart ?? noop,
      checkLabel: p.checkLabel ?? 'Solve my cube', onCheck: p.onCheck ?? noop, checkOff: !!p.checkDisabled,
      hasNotice: !!p.notice, notice: p.notice || { text: '' },
      hasFix: !!p.onFix, fixLabel: p.fixLabel ?? 'Fix colours', onFix: p.onFix ?? noop,
      hostRef: this._h || (this._h = el => { this.host = el; }),
      wellRef: this._w || (this._w = el => { this.well = el; })
    };
  }
}
</script>
</body>
</html>
