<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TurnCue</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/3dandcanvas-design-system-39c2f27a-19b5-4e24-81e1-72229778b310/tokens/fonts.css">
<link rel="stylesheet" href="_ds/3dandcanvas-design-system-39c2f27a-19b5-4e24-81e1-72229778b310/tokens/colors.css">
<link rel="stylesheet" href="_ds/3dandcanvas-design-system-39c2f27a-19b5-4e24-81e1-72229778b310/tokens/motion.css">
<link rel="stylesheet" href="_ds/3dandcanvas-design-system-39c2f27a-19b5-4e24-81e1-72229778b310/tokens/base.css">
<link rel="stylesheet" href="cube-tokens.css">
<style>
/* A glass cube that turns the way the real one should, drawn over the face being entered.
   Variants: kind = yaw (turn left) | yawr (turn right) | tip (tip toward you) |
   tipr (tip away) | flip (half turn); loop = keep repeating (camera) or play once (manual);
   surface = feed (over video) | panel (on white); mirrored flips it with a mirrored feed.
   The host fills the frame plus a margin, so the cue can overhang the face. */
[data-sc-name="TurnCue"]{position:absolute;inset:-6%;z-index:4;pointer-events:none}
.tc{position:absolute;inset:0;container-type:size;display:grid;place-items:center;perspective:1100px;animation:tc-in 280ms var(--ease-out) backwards}
.tc[data-loop="true"]{animation:tc-in 280ms var(--ease-out) backwards,tc-loop var(--dur-turn) linear infinite}
.tc[data-mirrored="true"]{transform:scaleX(-1)}
@keyframes tc-in{from{scale:.9;opacity:0}}
@keyframes tc-loop{0%{opacity:0}6%,90%{opacity:1}100%{opacity:0}}
.tc-view{--h:27cqw;position:relative;width:54%;aspect-ratio:1;transform-style:preserve-3d;transform:rotateX(-18deg) rotateY(-28deg)}
.tc-cube{position:absolute;inset:0;transform-style:preserve-3d;animation:var(--tc-anim) var(--dur-turn-once) var(--ease-in-out) forwards}
.tc[data-loop="true"] .tc-cube{animation:var(--tc-anim) var(--dur-turn) var(--ease-in-out) infinite}
.tc[data-kind="yaw"]{--tc-anim:tc-yaw}
.tc[data-kind="yawr"]{--tc-anim:tc-yawr}
.tc[data-kind="tip"]{--tc-anim:tc-tip}
.tc[data-kind="tipr"]{--tc-anim:tc-tipr}
.tc[data-kind="flip"]{--tc-anim:tc-flip}
@keyframes tc-yaw{0%,15%{transform:none}65%,100%{transform:rotateY(-90deg)}}
@keyframes tc-yawr{0%,15%{transform:none}65%,100%{transform:rotateY(90deg)}}
@keyframes tc-tip{0%,15%{transform:none}65%,100%{transform:rotateX(-90deg)}}
@keyframes tc-tipr{0%,15%{transform:none}65%,100%{transform:rotateX(90deg)}}
@keyframes tc-flip{0%,11%{transform:none}76%,100%{transform:rotateX(-180deg)}}
/* each face: the sticker grid as two hairline gradients over the face colour */
.tc-f{--grid:rgba(0,0,0,.18);position:absolute;inset:0;border-radius:var(--face-radius);backface-visibility:hidden;background:
  linear-gradient(90deg,transparent calc(33.33% - 1px),var(--grid) calc(33.33% - 1px) calc(33.33% + 1px),transparent calc(33.33% + 1px) calc(66.66% - 1px),var(--grid) calc(66.66% - 1px) calc(66.66% + 1px),transparent calc(66.66% + 1px)),
  linear-gradient(0deg,transparent calc(33.33% - 1px),var(--grid) calc(33.33% - 1px) calc(33.33% + 1px),transparent calc(33.33% + 1px) calc(66.66% - 1px),var(--grid) calc(66.66% - 1px) calc(66.66% + 1px),transparent calc(66.66% + 1px)),
  var(--c)}
.tc[data-surface="feed"] .tc-f{opacity:.86;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),inset 0 -18px 30px rgba(0,0,0,.12)}
.tc[data-surface="panel"] .tc-f{opacity:.9;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08),inset 0 -18px 30px rgba(0,0,0,.1)}
.tc-f.f{--c:var(--front);transform:translateZ(var(--h))}
.tc-f.r{--c:var(--right);transform:rotateY(90deg) translateZ(var(--h))}
.tc-f.l{--c:var(--left);transform:rotateY(-90deg) translateZ(var(--h))}
.tc-f.t{--c:var(--top);transform:rotateX(90deg) translateZ(var(--h))}
.tc-f.b{--c:var(--back);transform:rotateX(180deg) translateZ(var(--h))}
.tc-f.d{--c:var(--down);transform:rotateX(-90deg) translateZ(var(--h))}
.tc-f.f i{position:absolute;inset:0;display:grid;place-items:center;font-size:24cqw;color:var(--gray-800);opacity:.82}
/* Reduced motion: no spin. The cube shows where it ends up, which is the instruction. */
@media (prefers-reduced-motion:reduce){.tc,.tc[data-loop="true"]{animation:none}.tc-cube,.tc[data-loop="true"] .tc-cube{animation-duration:1ms;animation-iteration-count:1}}
</style>
</helmet>

<div class="tc" data-kind="{{ kind }}" data-loop="{{ loop }}" data-surface="{{ surface }}" data-mirrored="{{ mirrored }}" aria-hidden="true" style="--front:{{ front }};--right:{{ right }};--left:{{ left }};--top:{{ top }};--back:{{ back }};--down:{{ down }}">
  <div class="tc-view">
    <div class="tc-cube">
      <div class="tc-f t"></div>
      <div class="tc-f r"></div>
      <div class="tc-f l"></div>
      <div class="tc-f b"></div>
      <div class="tc-f d"></div>
      <div class="tc-f f"><i class="hgi-stroke hgi-{{ arrow }}"></i></div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":360},"kind":{"editor":"enum","options":["yaw","yawr","tip","tipr","flip"],"default":"yaw","tsType":"&#39;yaw&#39; | &#39;yawr&#39; | &#39;tip&#39; | &#39;tipr&#39; | &#39;flip&#39;","section":"Variant"},"loop":{"editor":"boolean","default":true,"tsType":"boolean","section":"Variant"},"surface":{"editor":"enum","options":["feed","panel"],"default":"panel","tsType":"&#39;feed&#39; | &#39;panel&#39;","section":"Variant"},"mirrored":{"editor":"boolean","default":false,"tsType":"boolean","section":"Variant"},"faces":{"editor":null,"tsType":"{ front, right, left, top, back, down: string }"}}'>
// The arrow on the front face points the way it moves.
const ARROW = { yaw: 'arrow-left-02', yawr: 'arrow-right-02', tip: 'arrow-down-02', tipr: 'arrow-up-02', flip: 'arrow-down-double' };
const SOLVED = { front: 'var(--cube-green)', right: 'var(--cube-red)', left: 'var(--cube-orange)', top: 'var(--cube-white)', back: 'var(--cube-blue)', down: 'var(--cube-yellow)' };
class Component extends DCLogic {
  renderVals() {
    const p = this.props, kind = ARROW[p.kind] ? p.kind : 'yaw', f = Object.assign({}, SOLVED, p.faces || {});
    return {
      kind, arrow: ARROW[kind],
      loop: String(p.loop ?? true), mirrored: String(!!p.mirrored), surface: p.surface ?? 'panel',
      front: f.front, right: f.right, left: f.left, top: f.top, back: f.back, down: f.down
    };
  }
}
</script>
</body>
</html>
