          <button type="button" class="me-cell {{ c.cls }}" style="--c:{{ c.colour }};--k:{{ c.k }}" data-cell="{{ c.i }}" aria-label="{{ c.label }}"></button>
        </sc-for>
      </div>
      <sc-if value="{{ isTurn }}" hint-placeholder-val="{{ false }}">
        <dc-import name="TurnCue" kind="{{ turn.kind }}" faces="{{ turn.faces }}" loop="{{ no }}" surface="panel" hint-size="100%,100%"></dc-import>
      </sc-if>
      <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">

    </div>
    <p id="me-help" class="gs-sr">Pick a colour, then tap or drag across stickers. Tapping a sticker that already has the colour clears it. Number keys 1 to 6 pick colours; arrow keys move between stickers.</p>

    <div class="me-pal" role="radiogroup" aria-label="Sticker colour">
      <sc-for list="{{ swatches }}" as="w" hint-placeholder-count="6">
        <button type="button" class="me-sw {{ w.cls }}" role="radio" aria-checked="{{ w.checked }}" aria-label="{{ w.label }}" data-key="{{ w.key }}" onClick="{{ w.pick }}">
          <span class="me-sw-c" style="--c:{{ w.colour }}"><i class="hgi-stroke hgi-tick-02" aria-hidden="true"></i></span>

        </button>
      </sc-for>
    </div>

    <div class="me-bottom">
      <x-import component-from-global-scope="Ds3DandCanvasDesignSystem_39c2f2.Button" variant="quiet" icon="arrow-left-02" disabled="{{ backOff }}" onClick="{{ back }}" hint-size="80px,34px">Back</x-import>

</div>

    if (this.apply(i, this.painting.mode) === false && i !== 4) this.painting = null;
  };
  // Enter/Space paint the focused sticker; arrow keys move between stickers, like a grid.
  key = e => {
    const t = e.target, i = t && t.dataset && t.dataset.cell != null ? Number(t.dataset.cell) : -1;
    if (i < 0) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.apply(i, 'start'); return; }
    const d = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] }[e.key];
    if (!d) return;
    e.preventDefault();
    const r = Math.min(2, Math.max(0, Math.floor(i / 3) + d[0])), c = Math.min(2, Math.max(0, (i % 3) + d[1]));
    const el = this.faceEl && this.faceEl.querySelector(`[data-cell="${r * 3 + c}"]`);
    if (el) el.focus();
  };

  // ---------------------------------------------------------------- turning the cube
  // From side `s` seen with `up` on top, the whole-cube turn that brings side `t` to the front, and what's on top after.
  plan(s, up, t) {
    const C = this.cc, F = C.FACES[s].key, T = C.FACES[t].key, ch = chipsOf(C, s, up);
    const dir = ['up', 'right', 'down', 'left'].find(d => ch[d] === T) || 'back';
    const newUp = dir === 'up' ? C.OPPOSITE[F] : dir === 'down' ? F : dir === 'back' ? C.OPPOSITE[up] : up;
    return { from: s, to: t, dir, kind: KIND[dir], newUp, front: F, chips: ch };
  }
  go(t) {
    const S = this.state;
    if (S.scene === 'turn' || t === S.step || t < 0) return;
    const m = this.plan(S.step, S.up, t);
    this.setState({ scene: 'turn', move: m, step: t, up: m.newUp, warn: null });
    clearTimeout(this.t);
    // After the turn, a cube still waiting on fixes keeps its flagged sides; otherwise back to editing.
    this.t = setTimeout(() => this.setState(s2 => ({ scene: s2.scene !== 'turn' ? s2.scene : s2.suspects.length ? 'invalid' : 'edit', fresh: Date.now() })), TURN_MS);
  }
  next = () => {
    const S = this.state, C = this.cc;
    if (!C.isComplete(S.caps[S.step])) return;
    if (S.caps.every(C.isComplete)) {
      const v = C.checkCaptures(S.caps);
      this.setState(v.ok ? { scene: 'done', suspects: [], warn: null } : { scene: 'invalid', suspects: v.suspects, warn: null });
      return;
    }
    // The next side still to fill, in the usual order.
    let t = S.step; do { t = (t + 1) % 6; } while (C.isComplete(S.caps[t]));
    this.go(t);
  };
  back = () => { const S = this.state; if (S.step > 0) this.go(S.step - 1); };

  // ---------------------------------------------------------------- view
  lineFor(S, left, eraser) {
    const C = this.cc, f = C.FACES[S.step], col = C.NAMES[f.key];
    const icon = (icon, text, tone) => ({ lead: 'icon', icon, text, tone: tone || 'neutral', dot: '' });
    const dot = (key, text) => ({ lead: 'dot', dot: C.colourVar(key), text, icon: '', tone: 'neutral' });
    if (S.warn && S.warn.kind === 'centre') return icon('information-circle', 'Centres stay fixed');
    switch (S.scene) {
      case 'turn': {
        const k = (S.move || {}).kind;
        return dot(f.key, k === 'tip' ? `Tip ${col} toward you` : k === 'tipr' ? `Tip ${col} up toward you` : k === 'flip' ? `Flip to ${col}` : `Turn to ${col}`);
      }
      case 'done': return icon('tick-02', 'All 6 sides', 'ok');
      // Short enough to fit beside Back and Check on a laptop; the flagged pips say which sides.
      case 'invalid': return icon('alert-circle', S.suspects.length ? 'Check the marked sides' : 'Stickers don’t fit. Check each side', 'warn');
    }
    if (eraser) return icon('eraser', `All 9 ${C.NAMES[S.sel]} placed · tap to clear`);
    if (left === 0) return icon('tick-02', `${C.titleCase(col)} done`, 'ok');
    if (left === 8) return dot(f.key, S.step === 0 && S.up === 'W' ? 'Fill green, white on top' : `Fill ${col}`);
    return dot(S.sel, `${left} to go`);
  }
  facesFor(caps) {
    if (this._facesFor !== caps) { this._facesFor = caps; this._faces = this.cc.toPhysical(caps); }
    return this._faces;
  }

  renderVals() {
    const S = this.state, C = this.cc;
    const refs = {
      yes: true, no: false,
      stageRef: this._st || (this._st = el => { this.stageEl = el; }),
      faceRef: this._fc || (this._fc = el => { this.faceEl = el; })
    };
    if (!S.ready || !C) return Object.assign({ cells: [], swatches: [], chips: [], strip: [], line: { text: '' }, now: {}, turn: {}, isTurn: false, isDone: false, backOff: true, nextOff: true, nextText: 'Next side' }, refs);
    const f = C.FACES[S.step], turn = S.scene === 'turn', isDone = S.scene === 'done';
    const map = viewMap(C, turnsOf(C, S.step, S.up));
    const cur = map.map(j => S.caps[S.step][j]);             // the side as you see it
    const left = cur.filter(x => !x).length;
    const n = C.countColours(S.caps), eraser = n[S.sel] >= 9;
    const m = S.move;
    // During a turn the stickers around the face belong to the cube as it was held; the one it's turning to pulses.
    const ch = turn && m ? m.chips : chipsOf(C, S.step, S.up);
    const allFull = S.caps.every(C.isComplete);
    return Object.assign({
      stageCls: isDone ? 'is-done' : '',
      frameCls: [turn ? 'is-turn' : '', isDone ? 'is-done' : '', S.fresh && !turn ? 'is-new' : ''].join(' '),
      chips: ['up', 'right', 'down', 'left'].map(d => ({
        dir: d, colour: C.colourVar(ch[d]), target: turn && m && m.dir === d,
        label: `Turn to ${C.NAMES[ch[d]]}`, go: () => this.go(C.stepOfColour(ch[d]))
      })),
      isTurn: turn, isDone,
      turn: m ? {
        kind: m.kind,
        faces: { front: C.colourVar(m.front), back: C.colourVar(C.OPPOSITE[m.front]), top: C.colourVar(m.chips.up), right: C.colourVar(m.chips.right), down: C.colourVar(m.chips.down), left: C.colourVar(m.chips.left) }
      } : { kind: 'yaw', faces: {} },
      faceLabel: `${f.name} side, ${C.NAMES[f.key]} centre`,
      selColour: C.colourVar(S.sel),
      cursor: cursorFor(C.HEX[S.sel], eraser),
      readyCls: C.isComplete(cur) && !turn && !isDone ? 'is-ready' : '',
      cells: cur.map((k, i) => ({
        i, k: WAVE[i], colour: k ? C.colourVar(k) : 'transparent',
        cls: i === 4 ? 'is-centre is-fill' : k ? 'is-fill' : 'is-empty',
        label: i === 4 ? `Centre, ${C.NAMES[k]}, fixed` : `Sticker ${i + 1}, ${k ? C.NAMES[k] : 'empty'}`
      })),
      down: this.down, move: this.move, key: this.key,
      swatches: C.PALETTE.map((k, idx) => ({
        key: k, colour: C.colourVar(k), left: Math.max(0, 9 - n[k]),
        label: `${C.titleCase(C.NAMES[k])}, ${Math.max(0, 9 - n[k])} left${n[k] >= 9 ? ', picks the eraser' : ''} (key ${idx + 1})`,
        checked: S.sel === k ? 'true' : 'false',
        cls: [S.sel === k ? 'is-sel' : '', n[k] >= 9 ? 'is-out' : '', C.isLight(k) ? 'is-light' : ''].join(' '),
        pick: () => this.pick(k)
      })),
      line: this.lineFor(S, left, eraser),
      backOff: S.step === 0 || turn,
      nextOff: !C.isComplete(cur) || turn || isDone,
      nextText: allFull ? 'Check cube' : 'Next side',
      next: this.next, back: this.back, restart: this.restart, check: this.check,
      step: S.step, faces: this.facesFor(S.caps),
      now: isDone
        ? { colour: C.colourVar('G'), title: 'Cube entered', sub: '6/6' }
        : { colour: C.colourVar(f.key), title: f.name, sub: `${C.titleCase(C.NAMES[f.key])} centre · ${S.step + 1}/6` },
      strip: C.FACES.map((x, i) => ({
        colour: C.colourVar(x.key), label: `${x.name} side${C.isComplete(S.caps[i]) ? '' : ', not finished'}${S.scene === 'invalid' && S.suspects.includes(i) ? ', check this side' : ''}`,
        open: C.isComplete(S.caps[i]) && !turn ? () => this.go(i) : null,
        done: C.isComplete(S.caps[i]), now: !isDone && i === S.step,
        flagged: S.scene === 'invalid' && S.suspects.includes(i), light: C.isLight(x.key)
      }))
    }, refs);
  }
}
</script>
</body>
</html>
