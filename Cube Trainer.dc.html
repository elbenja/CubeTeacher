/* ---- sidebar rows ---- */
.ct-row{position:relative;display:flex;align-items:center;gap:8px;width:100%;height:34px;padding:0 8px 0 18px;border:0;border-radius:10px;background:none;cursor:pointer;text-align:left;color:var(--text-secondary);font:var(--type-label);white-space:nowrap;transition:background-color calc(130ms*var(--m)) var(--ease-out),color calc(130ms*var(--m)) var(--ease-out),transform calc(280ms*var(--m)) var(--ease-spring-out)}

.ct-acc[data-open="true"] .ct-row:nth-child(6){animation-delay:100ms}
.ct-acc[data-open="true"] .ct-row:nth-child(7){animation-delay:120ms}

@keyframes ct-rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ---- move chips ---- */
.ct-chip{position:relative;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px 0 9px;border:0;border-radius:var(--radius-full);background:var(--gray-75);color:var(--text-primary);box-shadow:inset 0 0 0 1px var(--border-subtle);font:var(--type-mono);font-size:var(--text-base);font-weight:var(--weight-semibold);cursor:pointer;transition:background-color calc(130ms*var(--m)) var(--ease-out),color calc(130ms*var(--m)) var(--ease-out),box-shadow calc(130ms*var(--m)) var(--ease-out),transform calc(280ms*var(--m)) var(--ease-spring-out),opacity calc(190ms*var(--m)) var(--ease-out)}
.ct-chip:hover{background:var(--gray-150);transform:translateY(-2px) scale(1.05)}
.ct-chip:active{transform:scale(.93)}

.ct-chip[data-face="L"] .ct-dot{background:#ff7a18}
.ct-chip[data-face="F"] .ct-dot{background:#16c464}

.ct-strip[data-tint="true"] .ct-chip[data-face="R"]{background:#ee2b2b}
.ct-strip[data-tint="true"] .ct-chip[data-face="L"]{background:#ff7a18}

.ct-strip[data-tint="true"] .ct-chip[data-state="past"]{opacity:.34}
.ct-ring{position:absolute;left:0;top:0;border:2.5px solid var(--gray-900);border-radius:var(--radius-full);pointer-events:none;opacity:0;transition:transform calc(340ms*var(--m)) var(--ease-out),width calc(340ms*var(--m)) var(--ease-out),height calc(340ms*var(--m)) var(--ease-out),opacity calc(190ms*var(--m)) var(--ease-out)}

/* ---- mini chips (right panel) ---- */
.ct-mini{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 6px;border-radius:var(--radius-full);background:var(--gray-0);box-shadow:inset 0 0 0 1px var(--border-default);font:var(--type-mono);font-size:var(--text-xs);font-weight:var(--weight-semibold);color:var(--text-primary)}

/* ---- tooltips (400ms, token-built) ---- */
.ct-tip{position:relative;display:inline-flex}
.ct-tip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%) translateY(4px);padding:6px 9px;border-radius:var(--radius-md);background:var(--surface-inverse);color:var(--text-inverse);font:var(--type-caption);white-space:nowrap;box-shadow:var(--shadow-inverse);opacity:0;pointer-events:none;z-index:60;transition:opacity calc(130ms*var(--m)) var(--ease-out),transform calc(190ms*var(--m)) var(--ease-out)}
.ct-tip:hover::after{opacity:1;transform:translateX(-50%);transition-delay:400ms}
.ct-tip[data-side="right"]::after{left:calc(100% + 8px);bottom:auto;top:50%;transform:translate(-4px,-50%)}
.ct-tip[data-side="right"]:hover::after{transform:translate(0,-50%)}
.ct-tip[data-side="below"]::after{bottom:auto;top:calc(100% + 8px);transform:translateX(-50%) translateY(-4px)}
/* Anchored to the control's right edge instead of centred on it. For anything
   flush with the right panel's edge there is only 20px of window left, so a
   centred tip runs off-screen no matter how wide the panel is. */
.ct-tip[data-align="end"]::after{left:auto;right:0;transform:translateY(-4px)}
.ct-tip[data-align="end"]:hover::after{transform:translateY(0)}
/* Hoisted, JS-positioned twin of `.ct-tip::after` for chips inside
   `.ct-strip-stack`: that stack clips overflow on both axes (`overflow-y:auto`
   computes `overflow-x` to `auto` too, CSS Overflow 3 3.3), so a chip's own
   ::after -- anchored above the chip -- would never be visible there. This
   span lives in `.ct-strip`, outside the clipped stack, and showTip()/
   hideTip() position it from the hovered chip's data-tip via the --tip-x/
   --tip-y custom properties. Same look and reveal delay as `.ct-tip::after`
   by design, reusing the same tokens. */
.ct-strip-tip{position:absolute;left:0;top:0;padding:6px 9px;border-radius:var(--radius-md);background:var(--surface-inverse);color:var(--text-inverse);font:var(--type-caption);white-space:nowrap;box-shadow:var(--shadow-inverse);opacity:0;pointer-events:none;z-index:60;transform:translate(var(--tip-x,0),var(--tip-y,0)) translate(-50%,-100%) translateY(4px);transition:opacity calc(130ms*var(--m)) var(--ease-out),transform calc(190ms*var(--m)) var(--ease-out)}
.ct-strip-tip[data-show="true"]{opacity:1;transform:translate(var(--tip-x,0),var(--tip-y,0)) translate(-50%,-100%);transition-delay:400ms}

/* ---- panel chrome icon buttons ---- */

.ct-ib .dc-ib{width:34px;height:34px;border-radius:10px}

/* ---- heart ---- */
.ct-heart{position:relative;display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:10px;background:transparent;color:var(--icon-muted);cursor:pointer;transition:background-color calc(130ms*var(--m)) var(--ease-out),color calc(190ms*var(--m)) var(--ease-out),transform calc(280ms*var(--m)) var(--ease-spring-out)}
.ct-heart:hover{background:var(--surface-hover);color:var(--text-primary)}
.ct-heart:active{transform:scale(.93)}

.ct-heart[data-on="true"]::before{content:"";position:absolute;inset:3px;border-radius:50%;border:2px solid var(--red-500);animation:ct-burst calc(560ms*var(--m)) var(--ease-out) forwards}
@keyframes ct-pop{0%{transform:scale(.86)}45%{transform:scale(1.24)}100%{transform:scale(1)}}
@keyframes ct-burst{0%{transform:scale(.45);opacity:.6}100%{transform:scale(1.9);opacity:0}}

/* ---- variation cards ---- */
.ct-var{position:relative;display:block;width:100%;padding:10px;border:0;border-radius:var(--radius-lg);background:var(--surface-sunken);cursor:pointer;text-align:left;transform:perspective(720px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:box-shadow calc(190ms*var(--m)) var(--ease-out),transform calc(340ms*var(--m)) var(--ease-spring-out),background-color calc(130ms*var(--m)) var(--ease-out)}
.ct-var:hover{background:var(--gray-0);box-shadow:var(--shadow-float)}
.ct-var[data-sel="true"]{background:var(--gray-0);box-shadow:0 0 0 2px var(--blue-500)}
.ct-var canvas{display:block;width:100%;height:118px;object-fit:contain}
/* Moves and the repeat tally on one row. This used to be a column so a block
   could stack its stop condition underneath; that string now renders once per
   variation, so there is nothing left to stack and both surfaces agree. */
.ct-loop{display:flex;align-items:center;flex-wrap:nowrap;gap:6px;padding:7px 9px;border-radius:10px;background:var(--gray-0);box-shadow:inset 0 0 0 1px var(--border-default)}
.ct-loop-moves{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.ct-loop-meta{display:flex;align-items:center;gap:8px;min-width:0}
.ct-until{font:var(--type-caption);color:var(--text-secondary)}
/* The collapsed height of the move stack: 2.5 loop-rows (46px block + 8px gap).
   A custom property rather than a bare number because syncStackOverflow() reads
   it back — the button that lifts the cap has to know what the cap is. */
.ct{--stack-cap:131px}
/* One per variation, above the moves, so it stays put while the stack scrolls.
   --gray-700 on --amber-50 is 7.61:1, which clears AA for caption text. */
.ct-strip-until{padding:2px 10px;border-radius:var(--radius-full);background:var(--amber-50);color:var(--gray-700);font:var(--type-caption)}
/* Caption and toggle share one row, rendered only when at least one of them
   exists -- a short flat variation with neither keeps its old height.
   The toggle floated in the card's corner first. That fails: on a case with no
   caption the top row starts high enough to run under it, and the button
   covered the sixth chip of Superflip's top row and swallowed its clicks.
   Reserving a horizontal gutter instead cost more than it bought -- clearing
   the button needs >=24px, but keeping the phone's four rows needs <=10 and
   keeping 1440's two rows needs <=6, so no width satisfies all three; at 28px
   the wider blocks split from their spacer and left it alone on its own line.
   A row costs nothing wherever a caption already renders one.
   Three columns rather than a flex row with a spacer: the outer 1fr pair keeps
   the caption optically centred whether or not the toggle is there. */
.ct-strip-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%}
.ct-strip-head .ct-strip-until{grid-column:2;justify-self:center}
.ct-stack-toggle{grid-column:3;justify-self:end}
/* Wrapped and height-capped rather than one scrolled line -- the stacking in
   the mockup is this wrap at phone width, not a column. Measured, a block plus
   its spacer runs 287-313px, so two pairs need ~582px of content box: the
   323px phone box takes one pair per row, and of the desktop layouts only the
   640px box (viewport 1440) fits two. At the app's 1280 layout the panels leave
   a 564px box, which is 18px short, so that width wraps to three rows and
   scrolls. Capping the height protects the cube while still showing the
   algorithm's shape, which one line cannot.
   align-items:center is load-bearing, not decoration: .ct-chip has a definite
   32px height, so without it a standalone spacer sits flush with the top of a
   46px row while a chip inside a .ct-loop sits 7px down from its own padding.
   That 7px split is what makes followChip's backward trigger fire on a chip the
   forward park had just cleared.
   Nothing is reserved horizontally: the toggle lives in .ct-strip-head above,
   so the stack keeps its full content box and the measured row counts hold. */
.ct-strip-stack{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;width:100%;max-height:var(--stack-cap);overflow-y:auto;scrollbar-width:none}
.ct-strip-stack::-webkit-scrollbar{display:none}
/* Expanded, the cap lifts to whatever the content needs, bounded at 60vh so a
   long algorithm cannot re-cover the cube the cap exists to protect. Only the
   60vh arm binds: .ct-strip is an auto-height flex column, so the 100% resolves
   against an indefinite containing block and constrains nothing -- measured,
   `100%` alone lets the stack grow to its full content height. 60vh is not the
   stage, so this does not bound the strip against the stage. */
.ct-strip-stack[data-expanded="true"]{max-height:min(60vh,100%)}
.ct-strip-stack[data-fade="start"]{mask-image:linear-gradient(180deg,transparent 0,#000 24px)}
.ct-strip-stack[data-fade="end"]{mask-image:linear-gradient(180deg,#000 calc(100% - 24px),transparent 100%)}
.ct-strip-stack[data-fade="both"]{mask-image:linear-gradient(180deg,transparent 0,#000 24px,#000 calc(100% - 24px),transparent 100%)}
.ct-tally{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto}
/* Filled grey, going black as each loop completes: readable as a count while
   idle, and as progress while playing. Cards render statically, so their pips
   stay grey -- the strip is the only surface that fills. */
.ct-pip{width:8px;height:8px;border-radius:50%;background:var(--gray-400)}
.ct-pip[data-on="true"]{background:var(--text-primary)}

   variation actually has blocks -- on a flat variation every move would

.ct-mini[data-sep="true"]{background:var(--gray-150);box-shadow:none}
.ct-strip .ct-chip[data-spacer="true"][data-state="future"]{background:var(--gray-150);box-shadow:none}

@media (max-width:1180px){

}
@media (max-width:1024px){

     case name stays readable with the panel down. Both the peek and the room
     the stage leaves for it come off this one number. */
  .ct{--peek:78px}
  /* The design system's icon glyph carries its own z-index, which floats it out
     of the transport bar and over an unlayered sheet -- icons with no button
     under them. Give the sheet a layer of its own, still under the drawer scrim
     so opening the menu dims it. */
  .ct-right{position:fixed!important;left:328px!important;right:12px!important;bottom:0!important;top:auto!important;width:auto!important;max-height:56vh;border-radius:20px 20px 0 0;z-index:10;transform:translateY(calc(100% - var(--peek)));transition:transform calc(280ms*var(--m)) var(--ease-out)}

     54px handle and 16px header inset that read fine as panel chrome just push
     the title out of the peek. */
  .ct-rhead{padding-top:0!important}
  /* Closed, the whole peek is the toggle, so a tap on the visible title opens
     the sheet rather than landing on dead panel. Stops short of the heart so
     favouriting still works with the panel down. */
  .ct-right[data-sheet="closed"] .ct-sheet-handle::after{content:"";position:absolute;left:0;top:0;right:52px;height:var(--peek)}
  /* As a sheet the panel has no collapsed state to toggle into. */
  .ct-right .ct-ib{display:none}
  .ct-stage{right:20px!important;bottom:var(--peek)!important}
}
@media (max-width:768px){
  .ct-right{left:12px!important}
  .ct-side{position:fixed!important;z-index:55;transform:translateX(calc(-100% - 28px));transition:transform calc(280ms*var(--m)) var(--ease-out)}
  .ct-side[data-drawer="open"]{transform:none}
  .ct-burger{display:grid!important}
  /* Start the stage below the burger so it stops sitting on the group label.
     The room comes out of the dead gap above the cube, which is centred in the
     window rather than in the stage, so nothing moves to pay for it. */
  .ct-stage{left:16px!important;right:16px!important;top:32px!important}
  /* Two paragraphs 2px apart read as one; at this width they need the break. */
  .ct-teach p+p{margin-top:8px!important}
  .ct-scrim[data-on="true"]{opacity:1;pointer-events:auto}
  main.ct-stage>[data-sc-name="TeachCard"]{max-width:none!important}
}
@media (prefers-reduced-motion:reduce){
  .ct{--m:0.001}
}

<script type="text/x-dc" data-dc-script data-props="{&quot;cubeFinish&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;flat&quot;,&quot;clay&quot;],&quot;default&quot;:&quot;flat&quot;,&quot;tsType&quot;:&quot;'flat' | 'clay'&quot;,&quot;section&quot;:&quot;Cube&quot;},&quot;chipTint&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Move strip&quot;},&quot;motionLevel&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:7,&quot;min&quot;:0,&quot;max&quot;:10,&quot;step&quot;:1,&quot;unit&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;}}">
class Component extends DCLogic {
  state = {
    ready: false, algId: 'b-first-layer-edges', varIdx: 0,
    index: 0, total: 0, playing: false,
    open: { beginner: true, advanced: false, patterns: false, likes: false },
    likes: [], viewed: [], legendOpen: false,
    sideCollapsed: false, rightCollapsed: false, drawer: false, sheet: false,
    stripExpanded: false, stackOverflows: false
  };

  // The ring overhangs its chip by 4px on every side, so parked on a chip in
  // the last row its own border box pushes scrollHeight 4px past clientHeight.
  // Every edge test on the stack has to forgive that much, or a stack that
  // visibly fits reports as scrollable and grows a fade over nothing.
  RING_SLACK = 4;
  // scrollTop lands on fractions after a smooth scroll, so "at the start" is
  // a couple of pixels wide rather than exactly zero.
  SCROLL_EPSILON = 2;

  // ------------------------------------------------------------ lifecycle
  async componentDidMount() {
    this.varCanvas = [];
    this._refs = {};
    try {
      const data = await import('./algorithms.js');
      this.ALGORITHMS = data.ALGORITHMS;
      this.GROUPS = data.GROUPS;
      await this.waitFor(() => window.THREE);
      const eng = await import('./cube-engine.js');
      this.eng = eng;
      this.engine = new eng.CubeEngine(this.cubeEl, {
        finish: this.props.cubeFinish || 'flat',
        onIndex: (index, total) => this.setState({ index, total })
      });
      this.pool = new eng.MiniPool(256);
      const likes = this.read('cubetrainer.likes', []);
      const viewed = this.read('cubetrainer.viewed', []);
      const legend = this.read('cubetrainer.legend', null);
      this.setState({ ready: true, likes, viewed, legendOpen: legend === null }, () => {
        this.loadCurrent(true);
      });
    } catch (e) { console.error('[cube-trainer]', e); }
    this.onKey = e => this.handleKey(e);
    window.addEventListener('keydown', this.onKey);
    this.applyMotion();
  }

  componentWillUnmount() {
    window.removeEventListener('keydown', this.onKey);
    if (this.engine) this.engine.dispose();
    if (this.pool) this.pool.dispose();
    this._playing = false;
  }

  componentDidUpdate(prev) {
    this.followChip();
    this.positionRing();
    this.syncFade();
    this.syncStackOverflow();
    this.applyMotion();
    if (this.engine && this.props.cubeFinish !== prev.cubeFinish) this.engine.setFinish(this.props.cubeFinish || 'flat');
  }

  waitFor(fn, ms = 15000) {
    return new Promise((res, rej) => {
      const t0 = Date.now();
      const p = () => fn() ? res(fn()) : (Date.now() - t0 > ms ? rej(new Error('timeout')) : setTimeout(p, 40));
      p();
    });
  }

  read(k, fallback) {
    try { const v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); } catch (_) { return fallback; }
  }
  write(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }

  applyMotion() {
    if (!this.rootEl) return;
    const lvl = this.props.motionLevel != null ? this.props.motionLevel : 7;
    this.rootEl.style.setProperty('--m', String(Math.max(0.001, lvl / 7)));
  }

  // -------------------------------------------------------------- content
  algs() { return this.ALGORITHMS || []; }
  current() { return this.algs().find(a => a.id === this.state.algId) || this.algs()[0]; }
  currentVar() {
    const a = this.current();
    if (!a) return null;
    return a.variations[Math.min(this.state.varIdx, a.variations.length - 1)];
  }

  // The header badge reports structure, not a move total. A 51-move card is the
  // easiest kind of case -- three identical corners -- and a raw count says the
  // opposite.
  structureLabel(v) {
    const blocks = (v.entries || []).filter(e => e.kind === 'block');
    const total = (v.moves || []).length + ' moves';
    if (!blocks.length) return total;
    const reps = blocks.map(b => b.repeat);
    if (blocks.length === 1) return reps[0] > 1 ? '×' + reps[0] : total;
    const unit = this.current() && this.current().unit ? this.current().unit : 'run';
    const head = blocks.length + ' ' + unit + 's';
    if (reps.every(r => r === 1)) return head;
    return head + ' · ' + (reps.every(r => r === reps[0]) ? '×' + reps[0] + ' each' : reps.map(r => '×' + r).join(', '));
  }

  // One render item per run entry. `index` is the current flat move index, used
  // to fill the tally and mark the live chip; pass -1 for a static card.
  renderEntries(v, opts) {
    // Same fallback idiom renderVals() uses for these two helpers -- pretty/describe
    // live on this.eng, not at module scope, so a sibling method re-derives them.
    const P = this.eng || {};
    const pretty = P.prettyMove || (t => t);
    const describe = P.describeMove || (t => t);
    const entries = v.entries || [], map = v.runMap || [];
    const at = opts.index >= 0 && opts.index < map.length ? map[opts.index] : null;
    let flat = 0;
    return entries.map((e, ei) => {
      if (e.kind === 'spacer') {
        const i = flat++;
        return {
          key: ei + ':s', kind: 'spacer', i, face: e.move[0], label: pretty(e.move),
          state: i < opts.index ? 'past' : i === opts.index ? 'current' : 'future',
          tip: describe(e.move),
          jump: opts.interactive ? this.cache('jump-' + i, () => () => this.jump(i)) : null
        };
      }
      const first = flat;
      flat += e.repeat * e.moves.length;
      const live = at && at.entry === ei;
      const iteration = live ? at.iteration : (opts.index >= first ? e.repeat : 0);
      return {
        key: ei + ':b', kind: 'block', until: e.until || null,
        badge: e.until ? null : (e.repeat > 1 ? '×' + e.repeat : null),
        // A single run is not a loop, so it gets no tally: one lone pip reads as
        // progress through a repetition that never happens.
        dots: e.repeat > 1 ? Array.from({ length: e.repeat }, (_, k) => ({ key: k, on: k < iteration ? 'true' : 'false' })) : [],
        chips: e.moves.map((m, off) => {
          const target = first + (live ? at.iteration : 0) * e.moves.length + off;
          return {
            key: ei + ':' + off, i: target, face: m[0], label: pretty(m),
            state: live && off < at.offset ? 'past' : live && off === at.offset ? 'current' : 'future',
            tip: describe(m),
            // Keyed by the flat target, not position (ei+off): a block chip's target
            // shifts as the live iteration advances, and this.cache() is a permanent
            // memo, so a position-keyed closure would freeze on whichever iteration
            // first rendered it. Matches the spacer's 'jump-' + i scheme above.
            jump: opts.interactive ? this.cache('jump-' + target, () => () => this.jump(target)) : null
          };
        })
      };
    });
  }

  loadCurrent(markViewed) {
    const v = this.currentVar();
    if (!this.engine || !v) return;
    this.stopPlay();
    // The toggle has to be re-derived here, not only from componentDidUpdate:
    // it reads the stack's scrollHeight, which this load can change with no
    // state change to trigger an update.
    this.engine.load(v).then(() => {
      this.drawThumbs();
      this.positionRing();
      this.syncFade();
      this.syncStackOverflow();
    });
    if (markViewed) {
      const id = this.state.algId;
      if (this.state.viewed.indexOf(id) === -1) {
        const viewed = this.state.viewed.concat([id]);
        this.write('cubetrainer.viewed', viewed);
        this.setState({ viewed });
      }
    }
  }

  drawThumbs() {
    const a = this.current();
    if (!a || !this.pool) return;
    a.variations.forEach((v, i) => {
      const cv = this.varCanvas[i];
      if (cv) this.pool.draw(cv, { moves: v.moves, setup: v.setup, keep: v.keep, dim: v.dim, view: v.view, theta: 0 });
    });
  }

  selectAlg(id) {
    if (id === this.state.algId) return;
    // A new case means looking at the cube first, so the stack starts collapsed.
    this.setState({ algId: id, varIdx: 0, stripExpanded: false }, () => this.loadCurrent(true));
  }

  selectVar(i) {
    if (i === this.state.varIdx) return;
    this.setState({ varIdx: i, stripExpanded: false }, () => this.loadCurrent(false));
  }

  // ------------------------------------------------------------ transport
  stopPlay() { this._playing = false; if (this.state.playing) this.setState({ playing: false }); }

  async play() {
    if (!this.engine) return;
    if (this._playing) { this.stopPlay(); return; }
    if (this.engine.index >= this.engine.moves.length) await this.engine.reset();
    this._playing = true;
    this.setState({ playing: true });
    while (this._playing && this.engine.index < this.engine.moves.length) {
      await this.engine.step(1);
    }
    this._playing = false;
    this.setState({ playing: false });
  }

  jump(n) { this.stopPlay(); if (this.engine) this.engine.goTo(n, true); }
  step(d) { this.stopPlay(); if (this.engine) this.engine.step(d); }

  // "Reset to start" puts the whole view back to how the case opened: move
  // one, and the camera angle the user may have dragged away from.
  resetAll() { this.jump(0); if (this.engine) this.engine.resetView(); }

  handleKey(e) {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    const total = this.state.total;
    if (e.key === 'ArrowRight') { e.preventDefault(); e.shiftKey ? this.jump(total) : this.step(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); e.shiftKey ? this.jump(0) : this.step(-1); }
    else if (e.key === ' ') { e.preventDefault(); this.play(); }
    else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); this.resetAll(); }
    else if (e.key === 'Escape') this.setState({ drawer: false, sheet: false, legendOpen: false });
  }

  scrubDown(e) {
    if (!this.engine) return;
    this.stopPlay();
    const startX = e.clientX, start = this.engine.index, total = this.state.total;
    const el = e.currentTarget;
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    const move = ev => {
      const n = Math.max(0, Math.min(total, start + Math.round((ev.clientX - startX) / 22)));
      if (n !== this.engine.index) this.engine.goTo(n, false);
    };
    const up = () => {
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      el.removeEventListener('pointercancel', up);
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  }

  // ----------------------------------------------------------------- ring
  positionRing() {
    const stack = this.stripEl, ring = this.ringEl;
    if (!stack || !ring) return;
    // No clamp: once index reaches total every move is done, so there is no
    // current chip to ring — the lookup misses and the ring hides itself.
    const chip = stack.querySelector('[data-i="' + this.state.index + '"]');
    if (!chip || !this.state.total) { ring.style.opacity = '0'; return; }
    const sr = stack.getBoundingClientRect(), cr = chip.getBoundingClientRect();
    ring.style.width = (cr.width + 8) + 'px';
    ring.style.height = (cr.height + 8) + 'px';
    // Content coordinates, not viewport: adding scrollTop back cancels the
    // shift getBoundingClientRect() reports, so this value is the same whether
    // it is read before, during, or after a smooth scroll. That is what lets
    // followChip() and this run in either order.
    ring.style.transform = 'translate(' + (cr.left - sr.left - 4) + 'px,' + (cr.top - sr.top + stack.scrollTop - 4) + 'px)';
    ring.style.opacity = '1';
  }

  // 'auto' rather than 'smooth' under reduced motion. The CSS route for this is
  // --m, which a scrollBy() cannot read, so the preference is checked directly.
  smoothness() {
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    return reduce || this.props.motionLevel === 0 ? 'auto' : 'smooth';
  }

  // Edge-triggered, not centred. Centring would move the strip on all 52 steps
  // of a four-corner case; this leaves it still until the live chip is about to
  // fall off, then carries it across to the far edge. Matches how the ring
  // already reads -- a marker that travels, rather than a fixed sight the moves
  // slide under.
  followChip() {
    const stack = this.stripEl;
    // Same 4px of ring overflow syncFade allows for -- see the note there.
    if (!stack || stack.scrollHeight - stack.clientHeight <= this.RING_SLACK) return;
    const chip = stack.querySelector('[data-i="' + this.state.index + '"]');
    if (!chip) return;
    const sr = stack.getBoundingClientRect(), cr = chip.getBoundingClientRect();
    // One chip plus its gap of headroom: the turn happens while the chip after
    // the live one is still the thing about to be lost, not the live one.
    const lead = cr.height + 8;
    // Anchored to the chip rather than shifted by a fixed page. A relative
    // scrollBy overshoots by an amount that depends on chip size, dropping the
    // chip straight back into the opposite trigger zone -- so the next step
    // scrolls back and the stack flip-flops without ever settling.
    //
    // Park it a whole epsilon clear of the zone rather than exactly `lead`
    // inside the far edge: landing on the boundary leaves the opposite trigger
    // at the mercy of how the browser rounds scrollTop, and followChip runs on
    // every state change, not only on index changes -- so a re-render that
    // doesn't move the index would lurch the stack up and down.
    //
    // Content coordinates, as in positionRing: scrollTop and the rects are read
    // at the same instant, so this is correct even mid-animation.
    const park = lead + this.SCROLL_EPSILON;
    const cur = stack.scrollTop;
    const chipTop = cr.top - sr.top + cur;
    if (cr.bottom > sr.bottom - lead) stack.scrollTo({ top: chipTop - park, behavior: this.smoothness() });
    else if (cr.top < sr.top + lead) stack.scrollTo({ top: chipTop + cr.height + park - stack.clientHeight, behavior: this.smoothness() });
  }

  // Only fade an edge that actually has content past it -- a fade over a fully
  // scrolled end reads as content that is not there.
  syncFade() {
    const stack = this.stripEl;
    if (!stack) return;
    const start = stack.scrollTop > this.SCROLL_EPSILON;
    const end = stack.scrollTop + stack.clientHeight < stack.scrollHeight - this.RING_SLACK;
    stack.dataset.fade = start && end ? 'both' : start ? 'start' : end ? 'end' : 'none';
  }

  // Measured against the collapsed cap, never against clientHeight: expanded,
  // clientHeight grows to fit the content, so a clientHeight test would go
  // false and hide the very button that collapses it again. scrollHeight is the
  // content height in both states, so comparing it to the cap is stable.
  syncStackOverflow() {
    const stack = this.stripEl;
    if (!stack || !this.rootEl) return;
    const cap = parseFloat(getComputedStyle(this.rootEl).getPropertyValue('--stack-cap')) || 131;
    const overflows = stack.scrollHeight > cap + this.RING_SLACK;
    // Guarded: this runs from componentDidUpdate, so setting state on every
    // pass would be an infinite render loop.
    if (overflows !== this.state.stackOverflows) this.setState({ stackOverflows: overflows });
  }

  // A manual swipe changes which edges have content past them, and drags the
  // chips out from under a hovered tip.
  stripScroll() {
    this.syncFade();
    if (this._tipChip) this.hideTip();
  }

  // ------------------------------------------------------------ strip tip
  // Delegated, since chips are re-rendered on every move -- one listener on
  // the track outlives all of them instead of rebinding per chip.
  tipOver(e) {
    const chip = e.target.closest('.ct-chip');
    if (!chip || this._tipChip === chip) return;
    this.showTip(chip);
  }

  tipOut(e) {
    const chip = e.target.closest('.ct-chip');
    // relatedTarget is where the pointer went; still inside the same chip
    // (e.g. crossing from the dot to the label) isn't a real exit.
    if (!chip || chip.contains(e.relatedTarget)) return;
    this.hideTip();
  }

  showTip(chip) {
    const tip = this.tipEl, text = chip.getAttribute('data-tip');
    if (!tip || !text) return;
    tip.textContent = text;
    // Positioned relative to `.ct-strip` (the tip's own parent, already
    // position:relative) rather than the track, so scrolling the track
    // doesn't need to re-run this -- the tip is anchored for the duration
    // of one hover, same as the pseudo-element it replaces.
    const stripRect = tip.parentElement.getBoundingClientRect(), cr = chip.getBoundingClientRect();
    // Chip to chip, the browser fires pointerout(A) and pointerover(B) in one
    // task, so the pill never renders hidden in between: B's text lands while
    // the box still sits over A, and the move to B then inherits the 400ms
    // transition-delay the reveal carries -- B's text parked over A for most of
    // half a second. Muting transitions for the reposition and flushing it puts
    // the box over B while it is still invisible, so the delay only ever delays
    // the fade-in. A bare flush is not enough: the delay is on the shown state,
    // and it applies to transform as much as to opacity.
    tip.style.transition = 'none';
    tip.removeAttribute('data-show');
    tip.style.setProperty('--tip-x', (cr.left - stripRect.left + cr.width / 2) + 'px');
    tip.style.setProperty('--tip-y', (cr.top - stripRect.top - 8) + 'px');
    void tip.offsetWidth;
    tip.style.transition = '';
    tip.setAttribute('data-show', 'true');
    this._tipChip = chip;
  }

  hideTip() {
    if (this.tipEl) this.tipEl.removeAttribute('data-show');
    this._tipChip = null;
  }

  // ---------------------------------------------------------------- likes
  toggleLike() {
    const id = this.state.algId;
    const on = this.state.likes.indexOf(id) !== -1;
    const likes = on ? this.state.likes.filter(x => x !== id) : this.state.likes.concat([id]);
    this.write('cubetrainer.likes', likes);
    this.setState({ likes }, () => this.bumpBadge());
  }

  bumpBadge() {
    const el = this.badgeEl;
    if (!el || !el.animate) return;
    el.animate(
      [{ transform: 'translateY(0) scale(1)' }, { transform: 'translateY(-4px) scale(1.18)' }, { transform: 'translateY(0) scale(1)' }],
      { duration: 420, easing: 'cubic-bezier(.22,1,.36,1)' }
    );
  }

  // ----------------------------------------------------------------- tilt
  tilt(e) {
    const el = e.currentTarget, r = el.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
    el.style.setProperty('--ry', (x * 7).toFixed(2) + 'deg');
    el.style.setProperty('--rx', (-y * 7).toFixed(2) + 'deg');
  }
  untilt(e) {
    const el = e.currentTarget;
    el.style.setProperty('--ry', '0deg');
    el.style.setProperty('--rx', '0deg');
  }

  cache(key, make) {
    this._refs = this._refs || {};
    if (!this._refs[key]) this._refs[key] = make();
    return this._refs[key];
  }

  // ------------------------------------------------------------ renderVals
  renderVals() {
    const S = this.state;

    const alg = this.current();
    const groupLabels = { beginner: "Beginner's Method", advanced: 'Advanced Method', patterns: 'Fun Patterns' };
    const liked = S.likes.indexOf(S.algId) !== -1;

    const groups = (this.GROUPS || []).map(g => {
      const items = g.key === 'likes'
        ? this.algs().filter(a => S.likes.indexOf(a.id) !== -1)
        : this.algs().filter(a => a.group === g.key);
      return {
        key: g.key, name: g.name, icon: g.icon,
        count: String(items.length),
        open: S.open[g.key] ? 'true' : 'false',
        empty: g.key === 'likes' && items.length === 0 && S.open.likes,
        badgeRef: g.key === 'likes' ? this.cache('badge', () => el => { this.badgeEl = el; }) : null,
        toggle: this.cache('tg-' + g.key, () => () => this.setState(s => ({ open: Object.assign({}, s.open, { [g.key]: !s.open[g.key] }) }))),
        items: items.map(a => ({
          key: a.id, name: a.name,
          active: a.id === S.algId ? 'true' : 'false',
          done: S.viewed.indexOf(a.id) !== -1 ? 'true' : 'false',
          select: this.cache('sel-' + g.key + '-' + a.id, () => () => this.selectAlg(a.id))
        }))
      };
    });

    const cv = this.currentVar();
    // A spacer only reads as a separator when there are blocks for it to sit
    // between; on a flat variation every move would otherwise be marked as one.
    const hasBlocks = v => (v && v.entries ? v.entries : []).some(e => e.kind === 'block');
    const cvHasBlocks = hasBlocks(cv);
    const stripItems = cv ? this.renderEntries(cv, { index: S.index, interactive: true }).map(it => ({
      key: it.key, isBlock: it.kind === 'block', isSpacer: it.kind === 'spacer',
      face: it.face, label: it.label, state: it.state, tip: it.tip, jump: it.jump,
      i: it.i != null ? String(it.i) : '',
      isSep: it.kind === 'spacer' && cvHasBlocks ? 'true' : 'false',
      chips: it.chips, dots: it.dots, hasTally: !!(it.dots && it.dots.length),
      // The stop condition is a property of the variation, not of each block --
      // expandRun copies it onto all of them. It renders once, above the track.
      untilText: it.badge || ''
    })) : [];

    const variations = (alg ? alg.variations : []).map((v, i) => ({
      key: alg.id + ':' + i, label: v.label,
      structure: this.structureLabel(v),
      sel: i === S.varIdx ? 'true' : 'false',
      items: this.renderEntries(v, { index: -1, interactive: false }).map(it => ({
        key: it.key, isBlock: it.kind === 'block', isSpacer: it.kind === 'spacer',
        isSep: it.kind === 'spacer' && hasBlocks(v) ? 'true' : 'false',
        face: it.face, label: it.label, chips: it.chips, dots: it.dots, hasTally: !!(it.dots && it.dots.length),
        untilText: it.badge || ''
      })),
      canvasRef: this.cache('cv-' + i, () => el => { this.varCanvas[i] = el; if (el && this.pool) requestAnimationFrame(() => this.drawThumbs()); }),
      select: this.cache('var-' + i, () => () => this.selectVar(i)),
      tilt: this.cache('tilt', () => e => this.tilt(e)),
      untilt: this.cache('untilt', () => e => this.untilt(e))
    }));

    const crossAlg = alg && alg.crossLink ? this.algs().find(a => a.id === alg.crossLink) : null;

    return {
      rootRef: this.cache('root', () => el => { this.rootEl = el; }),
      cubeRef: this.cache('cube', () => el => { this.cubeEl = el; }),
      stripRef: this.cache('strip', () => el => { this.stripEl = el; }),
      ringRef: this.cache('ring', () => el => { this.ringEl = el; }),
      tipRef: this.cache('striptip', () => el => { this.tipEl = el; }),
      scrubRef: this.cache('scrub', () => el => { this.scrubEl = el; }),

      groups,
      cur: {
        name: alg ? alg.name : 'Loading',
        goal: alg ? alg.goal : '',
        whenToUse: alg ? alg.whenToUse : '',
        whyItWorks: alg ? alg.whyItWorks : '',
        groupLabel: alg ? (groupLabels[alg.group] || '') : '',
        hasCrossLink: !!crossAlg,
        crossLinkName: crossAlg ? crossAlg.name : ''
      },
      goCrossLink: e => { e.preventDefault(); if (crossAlg) this.selectAlg(crossAlg.id); },
      startBeginner: e => { e.preventDefault(); this.setState(s => ({ open: Object.assign({}, s.open, { beginner: true }) }), () => this.selectAlg('b-first-layer-edges')); },

      stripItems,
      stripUntil: cv && cv.until ? 'repeat loop until ' + cv.until : '',
      // Either/or, not always: a variation with no stop condition and few enough
      // rows to fit the cap gets no header row at all, and keeps its old height.
      stripHead: !!(cv && cv.until) || S.stackOverflows,
      stackExpanded: S.stripExpanded ? 'true' : 'false',
      stackOverflows: S.stackOverflows,
      stackToggleIcon: S.stripExpanded ? 'arrow-shrink-01' : 'arrow-expand-01',
      stackToggleTip: S.stripExpanded ? 'Collapse moves' : 'Expand moves',
      toggleStack: () => this.setState(s => ({ stripExpanded: !s.stripExpanded })),
      stripScroll: () => this.stripScroll(),
      tipOver: e => this.tipOver(e),
      tipOut: e => this.tipOut(e),
      variations,
      variationsLabel: variations.length + ' case variations',

      counter: Math.min(S.index + 1, Math.max(1, S.total)) + ' / ' + Math.max(1, S.total),
      atStart: S.index === 0,
      atEnd: S.index >= S.total,
      playIcon: S.playing ? 'pause' : S.index >= S.total && S.total > 0 ? 'refresh' : 'play',
      playTip: S.playing ? 'Pause (Space)' : S.index >= S.total && S.total > 0 ? 'Replay (Space)' : 'Play (Space)',
      play: () => this.play(),
      back: () => this.step(-1),
      fwd: () => this.step(1),
      reset: () => this.resetAll(),
      scrubDown: e => this.scrubDown(e),

      likedState: liked ? 'true' : 'false',
      heartTip: liked ? 'Remove from Likes' : 'Save to Likes',
      toggleLike: () => this.toggleLike(),


      legend: [
        { key: 'F', face: 'F', text: 'Front' },
        { key: 'B', face: 'B', text: 'Back' },
        { key: 'U', face: 'U', text: 'Up' },
        { key: 'D', face: 'D', text: 'Down' },
        { key: 'L', face: 'L', text: 'Left' },
        { key: 'R', face: 'R', text: 'Right' }
      ],
      shortcuts: [
        { key: 'a', k: '← →', t: 'Step one move' },
        { key: 'b', k: 'Space', t: 'Play / pause' },
        { key: 'c', k: 'R', t: 'Reset to start' },
        { key: 'd', k: '⇧ ← →', t: 'Jump to start / end' }
      ],
      legendOpen: S.legendOpen,
      toggleLegend: () => this.setState(s => ({ legendOpen: !s.legendOpen })),
      dismissLegend: () => { this.write('cubetrainer.legend', 'seen'); this.setState({ legendOpen: false }); },

      tintState: this.props.chipTint ? 'true' : 'false',
      sideCollapsed: S.sideCollapsed ? 'true' : 'false',
      sidebarTip: S.sideCollapsed ? 'Expand sidebar' : 'Collapse sidebar',
      toggleSidebar: () => this.setState(s => ({ sideCollapsed: !s.sideCollapsed })),
      rightCollapsed: S.rightCollapsed ? 'true' : 'false',
      rightTip: S.rightCollapsed ? 'Expand variations' : 'Collapse variations',
      toggleRight: () => this.setState(s => ({ rightCollapsed: !s.rightCollapsed })),
      drawerTip: S.drawer ? 'Close menu' : 'Open menu',
      drawerExpanded: S.drawer ? 'true' : 'false',
      drawerState: S.drawer ? 'open' : 'closed',
      drawerState2: S.drawer ? 'true' : 'false',
      toggleDrawer: () => this.setState(s => ({ drawer: !s.drawer })),
      closeDrawer: () => this.setState({ drawer: false }),
      sheetState: S.sheet ? 'open' : 'closed',
      sheetExpanded: S.sheet ? 'true' : 'false',
      toggleSheet: () => this.setState(s => ({ sheet: !s.sheet }))
    };
  }
}

</script>
